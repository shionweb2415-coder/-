<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOG｜Re:U Reverse Aging Salon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Serif JP", serif; color: #252525; background: #f8f8f6; line-height: 1.8; }
    a { color: inherit; }
    header { background: #fff; border-bottom: 1px solid #e7e7e2; }
    .header-inner { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .brand { font-size: 22px; letter-spacing: .08em; text-decoration: none; white-space: nowrap; }
    .back { text-decoration: none; font-size: 13px; letter-spacing: .04em; }
    main { max-width: 1100px; min-height: 72vh; margin: 0 auto; padding: 95px 24px 130px; }
    .subtitle { text-align: center; font-size: 12px; letter-spacing: .20em; color: #9b8565; margin: 0 0 13px; }
    h1 { text-align: center; font-size: clamp(32px, 5vw, 42px); font-weight: 500; letter-spacing: .13em; margin: 0 0 20px; }
    .lead { text-align: center; font-size: 15px; color: #666; margin: 0 0 70px; }
    .post-area { min-height: 220px; background: #fff; border: 1px solid #e7e7e2; display: flex; justify-content: center; align-items: center; text-align: center; padding: 35px 22px; }
    .post-area p { margin: 0; font-size: 15px; color: #777; }
    .post-area { display: block; min-height: 220px; padding: 30px; text-align: left; }
    .post-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
    .post-card { display: block; text-decoration: none; border: 1px solid #e7e7e2; background: #fff; overflow: hidden; }
    .post-card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
    .post-content { padding: 23px; }
    .post-date { font-size: 12px; color: #9b8565; margin: 0 0 10px; }
    .post-title { font-size: 18px; margin: 0 0 12px; line-height: 1.6; font-weight: 500; }
    .post-excerpt { font-size: 13px; color: #666; margin: 0; }
    .post-card:hover { box-shadow: 0 7px 30px #0000000d; }
    @media (max-width: 850px) { .post-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .post-grid { grid-template-columns: 1fr; } .post-area { padding: 18px; } }
    footer { padding: 26px 20px; border-top: 1px solid #e7e7e2; text-align: center; font-size: 12px; color: #777; }
    @media (max-width: 600px) { main { padding: 70px 20px 100px; } .lead { margin-bottom: 48px; } }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="index.html">Re:U</a>
      <a class="back" href="index.html">← TOPへ戻る</a>
    </div>
  </header>
  <main>
    <p class="subtitle">REVERSE AGING SALON</p>
    <h1>BLOG</h1>
    <p class="lead">Re:Uからのお知らせや、美容と健康に関する情報をお届けします。</p>
    <div class="post-area" aria-label="ブログ記事一覧">
      <p id="blog-message" role="status">記事を読み込んでいます…</p>
      <div class="post-grid" id="blog-list"></div>
    </div>
  </main>
  <footer>© Re:U Reverse Aging Salon</footer>
  <script src="blog-feed.js" defer></script>
</body>
</html>
